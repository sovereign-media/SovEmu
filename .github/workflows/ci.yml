name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand (Actions → CI → Run workflow): also checks the backend on macOS.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run. Runs on main all finish: each saves
  # the cargo caches the next builds start from, and a cancelled one would save nothing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: SovEmu.Backend

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target. macOS is where development happens, and every push is
        # formatted, linted and tested there first (.claude/rules/rust.md); its runners cost 10x
        # Linux's on a private repository, so CI checks it only when run by hand.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SovEmu.Backend

      # SovEmu.Media links the system libvpx and libopus through pkg-config.
      - name: Codec libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev libopus-dev pkg-config

      - name: Codec libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libvpx opus pkgconf

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  web:
    name: Web client (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SovEmu.Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SovEmu.Web/package-lock.json

      - run: npm ci

      - name: Generated GraphQL types match the schema
        run: npm run codegen:check

      - name: Test
        run: npm test

      - name: Check and build
        run: npm run build

  image:
    # The shipped artefact: Debian, cores from the pinned libretro release. The `test` target
    # runs the whole suite in the image; the runtime build fails if any shipped core cannot be
    # loaded. Both build in one bake (SovEmu.Backend/docker-bake.hcl), side by side.
    name: Container image
    runs-on: ubuntu-latest
    # A whole run takes ~15-20 minutes (a cold build more). Without a limit a hung step holds
    # the runner, and every later run on main queued behind it, for GitHub's default 6 hours.
    timeout-minutes: 60
    steps:
      # The runner has ~14 GB free; the build and its cargo caches (copied out of the builder to
      # be saved) need more. These preinstalled toolchains are ~25 GB that nothing here uses.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        id: buildx

      # Cargo's cache mounts (the registry and each target/) live in the builder and vanish with
      # the runner; keep them in the Actions cache so unchanged crates are not compiled again.
      # Pushes to main save them; pull requests only read them (a branch's cache is invisible
      # to other branches anyway), which keeps the 10 GB cache from filling with PR copies.
      - name: Cargo caches (restore and save, main)
        if: github.ref == 'refs/heads/main'
        # A cache problem costs time, never the build: the job still passes without one.
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: cache-mount
          key: cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-
            cargo-mounts-

      - name: Cargo caches (restore, pull requests)
        if: github.ref != 'refs/heads/main'
        # A cache problem costs time, never the build: the job still passes without one.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: cache-mount
          key: cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-
            cargo-mounts-

      # Puts the restored caches into the builder's cache mounts, and (after the build, on main)
      # takes them back out for the save above. The ids are the Dockerfile's.
      - name: Cargo caches into the builder
        # A cache problem costs time, never the build: the job still passes without one.
        continue-on-error: true
        # The limit covers the post step too (copying the caches back out on main), which once
        # hung until cancelled; with continue-on-error a timeout there only loses the cache.
        timeout-minutes: 15
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ github.ref != 'refs/heads/main' }}
          cache-map: |
            {
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
              "cache-mount/target-release": { "target": "/src/target", "id": "target-release" },
              "cache-mount/target-test": { "target": "/src/target", "id": "target-test" }
            }

      - name: Test suite and runtime image (probes every core)
        uses: docker/bake-action@v6
        with:
          source: .
          files: SovEmu.Backend/docker-bake.hcl
          targets: ci

      - name: Smoke test
        working-directory: .
        run: |
          # The image runs sovemu-server by default; name each binary to run it instead.
          docker run --rm sovemu:ci sovemu-server --version
          docker run --rm sovemu:ci sovemu-worker probe /opt/sovemu/cores > /dev/null

  chart:
    # charts/sovemu: lint and render every value set in ci/, and validate what it renders
    # against the Kubernetes schemas.
    name: Helm chart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charts/sovemu
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint and validate
        run: |
          for values in ci/*.yaml; do
            echo "::group::$values"
            helm lint . --strict -f "$values"
            helm template sovemu . -f "$values" | kubeconform -strict -summary -kubernetes-version 1.31.0 -
            echo "::endgroup::"
          done

      - name: Required settings are enforced
        run: |
          if helm template sovemu . >/dev/null 2>&1; then
            echo "rendering without media.advertiseIP should fail"; exit 1
          fi

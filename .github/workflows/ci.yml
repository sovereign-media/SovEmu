name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: SovEmu.Backend

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target; macOS is where development happens.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SovEmu.Backend

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  image:
    # The shipped artefact: Alpine (musl), cores built from source. The `test` target runs the
    # whole suite on musl; the runtime build fails if any shipped core cannot be loaded.
    name: Container image (Alpine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Test suite on musl
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SovEmu.Backend/Dockerfile
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime image (probes every core)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SovEmu.Backend/Dockerfile
          target: runtime
          load: true
          tags: sovemu:ci
          cache-from: type=gha

      - name: Smoke test
        working-directory: .
        run: |
          docker run --rm sovemu:ci --version
          docker run --rm sovemu:ci probe

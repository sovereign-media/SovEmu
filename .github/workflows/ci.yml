name: CI

on:
  push:
    branches: [main]
  pull_request:
  # By hand (Actions → CI → Run workflow): also checks the backend on macOS.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run. Runs on main all finish: each saves
  # the cargo caches the next builds start from, and a cancelled one would save nothing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: SovEmu.Backend

env:
  CARGO_TERM_COLOR: always

# Linux jobs run where the LARGE_RUNNER variable says: `sovereign-linux-large`, the self-hosted runners on
# the cluster (Actions Runner Controller, sovereign-media/sovereign#1547), or GitHub's runners when
# it is unset. The self-hosted image is the stock `ghcr.io/actions/actions-runner` (Ubuntu 24.04,
# Docker through a dind sidecar, no compilers or SDKs), so each job that builds or caches starts
# with sovereign-media/actions/setup-runner: it installs only what is missing (zstd among it, so the
# caches saved here and on GitHub's runners are the same ones), and does nothing on macOS.

jobs:
  # Which parts of the repository this push or pull request touched; each job below runs only
  # when one of its inputs did (and always when run by hand). A skipped job counts as passed,
  # so it can still be a required check. Every filter includes this file: a change to CI runs
  # everything it changes.
  changes:
    name: Changes
    # A quick job, without Docker: the small runners (2Gi), leaving the 9Gi ones to builds.
    runs-on: ${{ vars.SMALL_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - .github/workflows/ci.yml
              - SovEmu.Backend/**
            web:
              - .github/workflows/ci.yml
              - SovEmu.Web/**
              # The web client's GraphQL types come from it (schema:check, gql.tada check).
              - SovEmu.Backend/SovEmu.Server/schema.graphql
            # What the image is built from: the Dockerfile's COPY lines, and what reaches the
            # build context (.dockerignore).
            image:
              - .github/workflows/ci.yml
              - .dockerignore
              - SovEmu.Backend/**
              - SovEmu.Web/**
              - scripts/cores.list
              - scripts/install-cores.sh

  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target. macOS is where development happens, and every push is
        # formatted, linted and tested there first (.claude/rules/rust.md); its runners cost 10x
        # Linux's on a private repository, so CI checks it only when run by hand.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    # The matrix keeps GitHub's labels so the check names do not change; only Linux moves.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.MEDIUM_RUNNER || vars.LARGE_RUNNER) || matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # SovEmu.Media links the system libvpx, libopus and libavcodec through pkg-config. The C
      # toolchain and libclang (bindgen) are on GitHub's runners but not on the self-hosted image.
      # On macOS this does nothing; Homebrew installs the codecs below.
      - name: Set up the runner
        uses: sovereign-media/actions/setup-runner@7c1e75a8ac4ac92c10507edd13f535a8569b5fe1 # v1.0.0
        with:
          gh: 'false'
          apt: build-essential clang libclang-dev libvpx-dev libopus-dev libavcodec-dev libavutil-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SovEmu.Backend

      - name: Codec libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libvpx opus ffmpeg pkgconf

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    name: Web client (Vite)
    # A quick job, without Docker: the small runners (2Gi), leaving the 9Gi ones to builds.
    runs-on: ${{ vars.SMALL_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: SovEmu.Web
    steps:
      - uses: actions/checkout@v7

      - name: Set up the runner
        uses: sovereign-media/actions/setup-runner@7c1e75a8ac4ac92c10507edd13f535a8569b5fe1 # v1.0.0
        with:
          gh: 'false'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SovEmu.Web/package-lock.json

      - run: npm ci

      - name: GraphQL schema types match the schema
        run: npm run schema:check

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check and build
        run: npm run build

  image:
    # The shipped artefact: Debian, cores from the pinned libretro release. The `test` target
    # runs the whole suite in the image; the runtime build fails if any shipped core cannot be
    # loaded. Both build in one bake (SovEmu.Backend/docker-bake.hcl), side by side.
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    name: Container image
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Pushes to main publish the image to GHCR (the steps at the end).
      packages: write
    steps:
      # GitHub's runner has ~14 GB free; the build and its cargo caches (copied out of the builder
      # to be saved) need more. These preinstalled toolchains are ~25 GB that nothing here uses.
      # The self-hosted runner has none of them, and its pod requests the disk it needs.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v7

      - name: Set up the runner
        uses: sovereign-media/actions/setup-runner@7c1e75a8ac4ac92c10507edd13f535a8569b5fe1 # v1.0.0
        with:
          gh: 'false'

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # Cargo's cache mounts (the registry and each target/) live in the builder and vanish with
      # the runner; keep them in the Actions cache so unchanged crates are not compiled again.
      # Pushes to main save them; pull requests only read them (a branch's cache is invisible
      # to other branches anyway), which keeps the 10 GB cache from filling with PR copies.
      - name: Cargo caches (restore and save, main)
        if: github.ref == 'refs/heads/main'
        # A cache problem costs time, never the build: the job still passes without one.
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: cache-mount
          key: cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-
            cargo-mounts-

      - name: Cargo caches (restore, pull requests)
        if: github.ref != 'refs/heads/main'
        # A cache problem costs time, never the build: the job still passes without one.
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: cache-mount
          key: cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-mounts-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}-
            cargo-mounts-

      # Puts the restored caches into the builder's cache mounts, and (after the build, on main)
      # takes them back out for the save above. The ids are the Dockerfile's.
      - name: Cargo caches into the builder
        # A cache problem costs time, never the build: the job still passes without one.
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ github.ref != 'refs/heads/main' }}
          cache-map: |
            {
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
              "cache-mount/target-release": { "target": "/src/target", "id": "target-release" },
              "cache-mount/target-test": { "target": "/src/target", "id": "target-test" }
            }

      - name: Test suite and runtime image (probes every core)
        uses: docker/bake-action@v7
        with:
          source: .
          files: SovEmu.Backend/docker-bake.hcl
          targets: ci

      - name: Smoke test
        working-directory: .
        run: |
          # The image runs sovemu-server by default; name each binary to run it instead.
          docker run --rm sovemu:ci sovemu-server --version
          docker run --rm sovemu:ci sovemu-worker probe /opt/sovemu/cores > /dev/null

      # Every push to main that passed the tests and the smoke test is published, as the image
      # just tested (no rebuild): `bleeding` moves with main, `bleeding-<UTC yyyymmddHHMMSS>` is
      # fixed per build. The time is the commit's, not the build's, so a slow older build that
      # finishes after a newer one cannot sort above it. Keel follows `glob:bleeding-*`, which
      # compares tags as strings: the fixed width is what makes that order chronological. The
      # package is private, as the repository is.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sovemu
        run: |
          stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
          for tag in bleeding "bleeding-$stamp"; do
            docker tag sovemu:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Published \`$IMAGE:bleeding-$stamp\` ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

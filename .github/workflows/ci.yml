name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: each queued pull request is tested on top of main and the pull requests
  # ahead of it, then merged. The required checks must run here too, or nothing ever merges.
  merge_group:
  # By hand (Actions → CI → Run workflow): runs every job, whatever changed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its older run. Runs on main all finish: each one
  # publishes `bleeding`, and may save the cargo caches the next builds start from.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: SovEmu.Backend

env:
  CARGO_TERM_COLOR: always

# Linux jobs run on GitHub's runners (`ubuntu-latest`): the repository is public, so they are free.
# The SMALL_RUNNER, MEDIUM_RUNNER and LARGE_RUNNER variables name other runners when set; the
# organisation's own (`sovereign-linux-*`, on the cluster, sovereign-media/sovereign#1547) are
# for its private repositories only, never a public one, whose pull requests run code from
# anyone. A public repository cannot use the organisation's private actions either, so every
# step here is a public action or a plain command.

jobs:
  # Which parts of the repository this push or pull request touched; each job below runs only
  # when one of its inputs did (and always when run by hand). A skipped job counts as passed,
  # so it can still be a required check. Every filter includes this file: a change to CI runs
  # everything it changes.
  changes:
    name: Changes
    # A quick job, without Docker: the small runners (2Gi), leaving the 9Gi ones to builds.
    runs-on: ${{ vars.SMALL_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A merge group is compared with git (no pull request to ask): fetch both commits.
          fetch-depth: ${{ github.event_name == 'merge_group' && 0 || 1 }}

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # In the merge queue, what this group adds to main.
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            backend:
              - .github/workflows/ci.yml
              - SovEmu.Backend/**
            web:
              - .github/workflows/ci.yml
              - SovEmu.Web/**
              # The web client's GraphQL types come from it (schema:check, gql.tada check).
              - SovEmu.Backend/SovEmu.Server/schema.graphql
            # What the image is built from: the Dockerfile's COPY lines, and what reaches the
            # build context (.dockerignore).
            image:
              - .github/workflows/ci.yml
              - .dockerignore
              - SovEmu.Backend/**
              - SovEmu.Web/**
              - scripts/cores.list
              - scripts/install-cores.sh

  backend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    # Formatting and clippy only. The tests run once, in the container job, against the libraries
    # the image ships (Debian's FFmpeg and libvpx) and with Mesa for the GPU tests; running them
    # here too, against the runner's Ubuntu, covered less and cost a second compile. Linux only:
    # the image is the one deliverable.
    name: Backend (lint)
    runs-on: ${{ vars.MEDIUM_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # SovEmu.Media links the system libvpx, libopus and libavcodec through pkg-config, and
      # bindgen needs libclang.
      - name: System libraries
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential clang libclang-dev libvpx-dev libopus-dev libavcodec-dev libavutil-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SovEmu.Backend

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    name: Web client (Vite)
    # A quick job, without Docker: the small runners (2Gi), leaving the 9Gi ones to builds.
    runs-on: ${{ vars.SMALL_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: SovEmu.Web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SovEmu.Web/package-lock.json

      - run: npm ci

      - name: GraphQL schema types match the schema
        run: npm run schema:check

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check and build
        run: npm run build

  image:
    # The shipped artefact: Debian, cores from the pinned libretro release. The `test` target
    # runs the whole suite in the image; the runtime build fails if any shipped core cannot be
    # loaded. Both build in one bake (SovEmu.Backend/docker-bake.hcl), side by side.
    #
    # Built once per commit (#245): the merge queue builds and tests the commit `main` gets, and
    # publishes it as `sha-<commit>`; the push to `main` then retags that image as `bleeding`
    # without compiling. It builds again only when the queue's image is missing (a push that did
    # not come through the queue) or when the Cargo caches for this lockfile are not saved yet.
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true'
    name: Container image
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      # The merge queue publishes the commit it tested, and main tags it (the steps at the end).
      # The queue holds only pull requests already approved, so this widens no trust.
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sovemu
      # Pushes to main: the only runs that publish `bleeding`, and that save the Cargo caches.
      MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # GitHub's runner has ~14 GB free; the build and its cargo caches (copied out of the builder
      # to be saved) need more. These preinstalled toolchains are ~25 GB that nothing here uses.
      # Deleted in the background: the build needs the room only minutes later, and waiting for
      # the deletion took one to two minutes of every run (#245). A background process lives
      # until the job ends. The self-hosted runner has none of them, and its pod requests the disk
      # it needs.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        working-directory: .
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            > /dev/null 2>&1 &

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Log in to GHCR
        if: env.MAIN == 'true' || github.event_name == 'merge_group'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Cargo caches belong to a lockfile and a Rust version, never to a run: what changes
      # from one commit to the next (SovEmu's own crates) recompiles every time anyway, and is
      # pruned before saving. So a key is saved once, on main, the first time it is missing.
      - name: Cargo cache key
        id: cache
        working-directory: .
        run: |
          rust=$(sed -n 's/^ARG RUST_VERSION=//p' SovEmu.Backend/Dockerfile)
          echo "key=cargo-mounts-rust$rust-${{ hashFiles('SovEmu.Backend/Cargo.lock') }}" >> "$GITHUB_OUTPUT"

      # On main: is this key saved already? Looked up, not downloaded.
      - name: Cargo caches saved for this lockfile?
        id: saved
        if: env.MAIN == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: cache-mount
          key: ${{ steps.cache.outputs.key }}
          lookup-only: true

      # On main, with the caches saved: the merge queue's image for this very commit, if it
      # published one. Then nothing is built.
      - name: The merge queue's image
        id: queued
        if: env.MAIN == 'true' && steps.saved.outputs.cache-hit == 'true'
        working-directory: .
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "The merge queue built and tested \`$IMAGE:sha-$GITHUB_SHA\`: retagging it, no build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No \`sha-$GITHUB_SHA\` from the merge queue: building."
          fi

      # Cargo's cache mounts (the registry and each target/) live in the builder and vanish with
      # the runner; the Actions cache keeps them, so unchanged crates are not compiled again.
      # Every build reads them; main saves a key it is missing (the last steps). A cache problem
      # costs time, never the build: the job still passes without one.
      - name: Cargo caches (restore)
        if: steps.queued.outputs.found != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: cache-mount
          key: ${{ steps.cache.outputs.key }}
          restore-keys: cargo-mounts-

      # Puts the restored caches into the builder's cache mounts, and takes them back out after
      # the build only when main is about to save them. The ids are the Dockerfile's.
      - name: Cargo caches into the builder
        if: steps.queued.outputs.found != 'true'
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ !(env.MAIN == 'true' && steps.saved.outputs.cache-hit != 'true') }}
          cache-map: |
            {
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" },
              "cache-mount/cargo-registry-notices": { "target": "/usr/local/cargo/registry", "id": "cargo-registry-notices" },
              "cache-mount/target-release": { "target": "/src/target", "id": "target-release" },
              "cache-mount/target-test": { "target": "/src/target", "id": "target-test" }
            }

      # The commit's time, written beside the server (the admin About page) with its SHA.
      - name: Build stamp
        if: steps.queued.outputs.found != 'true'
        run: echo "SOVEMU_BUILT=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)" >> "$GITHUB_ENV"

      - name: Test suite and runtime image (probes every core)
        if: steps.queued.outputs.found != 'true'
        uses: docker/bake-action@v7
        # SovEmu's own ScreenScraper developer credentials, built into the image (docker-bake.hcl
        # passes them as BuildKit secrets). Empty for a fork's pull request: none built in.
        env:
          SOVEMU_BUILD_SCREENSCRAPER_DEVID: ${{ secrets.SCREENSCRAPER_DEVID }}
          SOVEMU_BUILD_SCREENSCRAPER_DEVPASSWORD: ${{ secrets.SCREENSCRAPER_DEVPASSWORD }}
        with:
          source: .
          files: SovEmu.Backend/docker-bake.hcl
          targets: ci

      - name: Smoke test
        if: steps.queued.outputs.found != 'true'
        working-directory: .
        run: |
          # The image runs sovemu-server by default; name each binary to run it instead.
          docker run --rm sovemu:ci sovemu-server --version
          docker run --rm sovemu:ci sovemu-worker probe /opt/sovemu/cores > /dev/null

      # Before saving: SovEmu's own crates out of each target/. They recompile on every commit, so
      # a cached copy only costs space and the time to move it (once ~11 minutes on main).
      - name: Prune SovEmu's own crates from the caches
        if: env.MAIN == 'true' && steps.saved.outputs.cache-hit != 'true'
        continue-on-error: true
        working-directory: .
        run: |
          for target in cache-mount/target-*; do
            [ -d "$target" ] || continue
            sudo find "$target" -mindepth 2 -maxdepth 3 \
              \( -path '*/deps/*sovemu*' -o -path '*/.fingerprint/sovemu-*' -o -path '*/build/sovemu-*' \
                 -o -path '*/sovemu-*' -o -path '*/libsovemu*' \) \
              -prune -exec rm -rf {} +
          done
          sudo du -sh cache-mount/* || true

      - name: Cargo caches (save, main)
        if: env.MAIN == 'true' && steps.saved.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: cache-mount
          key: ${{ steps.cache.outputs.key }}

      # The merge queue publishes the commit it tested, as `sha-<commit>`: the commit main gets
      # when the queue merges, which main then tags (next step) instead of building it again.
      - name: Publish the queue's image
        if: github.event_name == 'merge_group'
        working-directory: .
        run: |
          docker tag sovemu:ci "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"

      # Every push to main that passed the tests and the smoke test is published, as the image
      # tested (no rebuild): `bleeding` moves with main, `bleeding-<UTC yyyymmddHHMMSS>` is fixed
      # per build. The time is the commit's, not the build's, so a slow older build that finishes
      # after a newer one cannot sort above it. Keel follows `glob:bleeding-*`, which compares tags
      # as strings: the fixed width is what makes that order chronological. The package is public,
      # as the repository is.
      - name: Publish to GHCR
        if: env.MAIN == 'true'
        working-directory: .
        env:
          QUEUED: ${{ steps.queued.outputs.found }}
        run: |
          stamp=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)
          if [ "$QUEUED" = true ]; then
            docker buildx imagetools create -t "$IMAGE:bleeding" -t "$IMAGE:bleeding-$stamp" "$IMAGE:sha-$GITHUB_SHA"
          else
            for tag in bleeding "bleeding-$stamp" "sha-$GITHUB_SHA"; do
              docker tag sovemu:ci "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
            done
          fi
          echo "Published \`$IMAGE:bleeding-$stamp\` ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

  coverage:
    # The backend's test coverage, reported, never required: the `coverage` bake target runs the
    # suite under cargo-llvm-cov in the test stage's image (Mesa included, so the GPU tests count),
    # puts the per-file summary in the run's summary, and keeps the reports (HTML, lcov) as an
    # artifact. On main and by hand only: it is a second full compile, instrumented.
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true')
    name: Coverage
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # The registry the image job saves (read only here: this job's instrumented target/ is
      # its own, and not worth the cache's space).
      - name: Cargo registry cache (restore)
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: cache-mount
          key: cargo-mounts-
          restore-keys: cargo-mounts-

      - name: Cargo registry into the builder
        continue-on-error: true
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: true
          cache-map: |
            {
              "cache-mount/cargo-registry": { "target": "/usr/local/cargo/registry", "id": "cargo-registry" }
            }

      - name: Test suite under coverage
        uses: docker/bake-action@v7
        with:
          source: .
          files: SovEmu.Backend/docker-bake.hcl
          targets: coverage

      - name: Summary
        working-directory: .
        run: |
          {
            echo "### Backend coverage"
            echo
            echo '```'
            grep -E '^(Filename|TOTAL)' coverage/summary.txt
            echo '```'
            echo
            echo "<details><summary>Per file</summary>"
            echo
            echo '```'
            cat coverage/summary.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 30

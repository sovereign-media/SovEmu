[workspace]
resolver = "3"
members = [
    "SovEmu.Assets",
    "SovEmu.Identity",
    "SovEmu.LibretroFfi",
    "SovEmu.PortMapping",
    "SovEmu.Library",
    "SovEmu.Media",
    "SovEmu.Protocol",
    "SovEmu.Relay",
    "SovEmu.RetroHost",
    "SovEmu.Server",
    "SovEmu.Sessions",
    "SovEmu.TestCore",
    "SovEmu.Worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/sovereign-media/SovEmu"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
# `pub` only for what another crate can reach: inside a binary or a module, `pub(crate)`.
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# The media crate converts and encodes every frame: unoptimised, its colour conversion alone
# takes several times a frame's encode, so the startup encoder test (run by every test that
# starts a server with a worker) took 9 seconds in a debug build against 1 optimised.
[profile.dev.package.sovemu-media]
opt-level = 3

[profile.release]
# The worker is a long-running per-session process: favour speed, keep symbols for crash reports.
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The server waits on the network and SQLite, not the CPU: one codegen unit made its release
# build ~2.5x slower (CI: 3m 25s of a 3m 45s build) for no difference anyone sees. The worker,
# whose frame loop it is, keeps one; splitting it saved ~1.5 s. Dependencies keep one too (they
# come from the cache).
[profile.release.package.sovemu-server]
codegen-units = 16

[package]
name = "sovemu-libretro-ffi"
description = "Raw bindings to libretro.h, generated by bindgen from the copy kept in include/"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
links = "sovemu_log_shim"

[features]
default = ["frontend"]
# The C shim a frontend needs to hand cores a printf-style log callback (Rust cannot define a
# C-variadic function on stable). A core, such as SovEmu.TestCore, turns this off.
frontend = []

[build-dependencies]
bindgen = "0.73.2"
cc = "1.11.2"

[lints]
workspace = true

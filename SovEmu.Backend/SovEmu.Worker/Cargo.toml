[package]
name = "sovemu-worker"
description = "The per-session process that hosts one libretro core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
hound = "3.5.1"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sovemu-media = { version = "0.1.0", path = "../SovEmu.Media" }
sovemu-protocol = { version = "0.1.0", path = "../SovEmu.Protocol" }
sovemu-retro-host = { path = "../SovEmu.RetroHost" }
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }
tiny_http = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints]
workspace = true

[dev-dependencies]
hound = "3.5.1"
png = "0.18.1"
serde_json = "1.0.154"
sovemu-media = { path = "../SovEmu.Media" }
sovemu-protocol = { path = "../SovEmu.Protocol" }
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }

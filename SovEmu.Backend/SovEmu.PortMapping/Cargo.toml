[package]
name = "sovemu-port-mapping"
description = "SovEmu asks the home router to forward its game and relay ports (UPnP IGD and NAT-PMP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Both protocols are written here (NAT-PMP is two 12-byte packets; UPnP is a multicast search,
# one XML file and three SOAP calls), over what the server already links: reqwest for UPnP's
# HTTP and roxmltree for its XML. `igd-next` would bring HTTP/2 (h2) and two more XML crates.
reqwest = { version = "0.13.5", default-features = false }
roxmltree = "0.21.2"
url = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "io-util"] }

[lints]
workspace = true

[package]
name = "sovemu-server"
description = "SovEmu server: web client, API, ROM library and game sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sovemu-assets = { path = "../SovEmu.Assets" }
sovemu-identity = { path = "../SovEmu.Identity" }
sovemu-library = { path = "../SovEmu.Library" }
sovemu-sessions = { path = "../SovEmu.Sessions" }
sovemu-protocol = { path = "../SovEmu.Protocol" }
anyhow = "1"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "io-util", "time", "net", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
tracing-opentelemetry = "0.34"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
# OTLP over HTTP/protobuf with reqwest's blocking client: the SDK's batch exporters run on their
# own threads, and it shares this crate's reqwest (and its rustls).
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }

[dev-dependencies]
base64 = "0.22"
url = "2"
axum = "0.8"
http-body-util = "0.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

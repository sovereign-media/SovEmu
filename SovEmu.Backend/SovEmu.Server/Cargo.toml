[package]
name = "sovemu-server"
description = "SovEmu server: web client, API, ROM library and game sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sovemu-protocol = { path = "../SovEmu.Protocol" }
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "io-util", "time", "net", "sync", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true

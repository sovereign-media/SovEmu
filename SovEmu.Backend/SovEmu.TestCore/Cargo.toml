[package]
name = "sovemu-test-core"
description = "A deterministic libretro core for testing the SovEmu frontend without a real emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Built as a shared library and loaded with dlopen, exactly like a real core.
crate-type = ["cdylib"]

[dependencies]
sovemu-libretro-ffi = { path = "../SovEmu.LibretroFfi", default-features = false }

[lints]
workspace = true

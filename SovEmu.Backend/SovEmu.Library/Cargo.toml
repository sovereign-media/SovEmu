[package]
name = "sovemu-library"
description = "SovEmu's ROM library: systems, scanning, parts and patches, release labels, BIOS files, game information clients, the cache and mirror, decorations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex = "0.4"
md-5 = "0.11.0"
png = "0.18.1"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
roxmltree = "0.21.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "io-util", "fs", "time", "macros"] }
tracing = "0.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[lints]
workspace = true

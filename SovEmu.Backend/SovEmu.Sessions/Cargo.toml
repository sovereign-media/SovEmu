[package]
name = "sovemu-sessions"
description = "SovEmu's game sessions: one sovemu-worker process per game, started, driven over stdin/stdout and stopped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sovemu-library = { path = "../SovEmu.Library" }
sovemu-protocol = { path = "../SovEmu.Protocol" }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "sync"] }
tracing = "0.1"

[lints]
workspace = true

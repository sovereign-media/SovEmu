# Use a NAS library instead of data/roms:
#
#   docker compose -f compose.yaml -f compose.nas.yaml up -d
#
# Mounts //$SOVEMU_NAS_HOST/$SOVEMU_NAS_PATH read-only. That folder holds a Batocera-style
# library: roms/<system>/ (with images/ and videos/ artwork beside the ROMs). BIOS files stay
# local, in data/bios/<system>/.
# Credentials come from .env (gitignored; see .env.example), never from this file.
services:
  sovemu:
    environment:
      SOVEMU_ROMS_DIR: /nas/roms
      # A Batocera-style decorations folder beside the ROMs, if the share has one.
      SOVEMU_DECORATIONS_DIRS: ${SOVEMU_DECORATIONS_DIRS:-/nas/decorations}
      # SOVEMU_LIBRARY_MODE (direct | cache | mirror), SOVEMU_CACHE_GB and SOVEMU_MIRROR_SYSTEMS
      # come from .env like every other setting.
      # The share's credentials are only for the mount below: blank them inside the container
      # (compose still reads them from .env to mount the share).
      SOVEMU_NAS_USER: ""
      SOVEMU_NAS_PASSWORD: ""
    volumes:
      - nas:/nas:ro

volumes:
  nas:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SOVEMU_NAS_HOST:-nas.blh.casa}/${SOVEMU_NAS_PATH:-MEDIA/emulation}"
      o: "ro,username=${SOVEMU_NAS_USER:?set SOVEMU_NAS_USER in .env},password=${SOVEMU_NAS_PASSWORD:?set SOVEMU_NAS_PASSWORD in .env},uid=1000,gid=1000,vers=3.0"

# Use a NAS library instead of data/roms:
#
#   docker compose -f compose.yaml -f compose.nas.yaml up -d
#
# //$SOVEMU_NAS_HOST/$SOVEMU_NAS_PATH is a Batocera-style folder on an SMB share: roms/<system>/
# and bios/. Only those two are mounted, read-only, as the cluster's chart does: roms/ at
# /sov-library (the system folders at its root) and bios/ at /sov-bios, used as it is (BIOS files
# are found in any layout). Nothing else of the share is visible in the container.
#
# A decorations folder on the share too? Add a third volume like these (device .../decorations)
# mounted at /sov-decorations, and set SOVEMU_DECORATIONS_DIRS=/sov-decorations. It is not
# mounted by default: a folder the share lacks would stop the container from starting.
#
# Credentials come from .env (gitignored; see .env.example), never from this file.
services:
  sovemu:
    environment:
      SOVEMU_ROMS_DIR: /sov-library
      SOVEMU_BIOS_DIR: /sov-bios
      # SOVEMU_LIBRARY_MODE (direct | cache | mirror), SOVEMU_CACHE_GB and SOVEMU_MIRROR_SYSTEMS
      # come from .env like every other setting.
      # The share's credentials are only for the mounts below: blank them inside the container
      # (compose still reads them from .env to mount the share).
      SOVEMU_NAS_USER: ""
      SOVEMU_NAS_PASSWORD: ""
    volumes:
      # Replaces compose.yaml's ./data/roms mount at the same path.
      - nas-roms:/sov-library:ro
      - nas-bios:/sov-bios:ro

x-nas: &nas
  driver: local
  driver_opts: &nas-opts
    type: cifs
    o: "ro,username=${SOVEMU_NAS_USER:?set SOVEMU_NAS_USER in .env},password=${SOVEMU_NAS_PASSWORD:?set SOVEMU_NAS_PASSWORD in .env},uid=1000,gid=1000,vers=3.0"

volumes:
  nas-roms:
    <<: *nas
    driver_opts:
      <<: *nas-opts
      device: "//${SOVEMU_NAS_HOST:-nas.blh.casa}/${SOVEMU_NAS_PATH:-MEDIA/emulation}/roms"
  nas-bios:
    <<: *nas
    driver_opts:
      <<: *nas-opts
      device: "//${SOVEMU_NAS_HOST:-nas.blh.casa}/${SOVEMU_NAS_PATH:-MEDIA/emulation}/bios"

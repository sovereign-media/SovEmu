# Use a NAS library instead of data/roms:
#
#   docker compose -f compose.yaml -f compose.nas.yaml up -d
#
# Mounts //$SOVEMU_NAS_HOST/$SOVEMU_NAS_PATH read-only. That folder holds a Batocera-style
# library: roms/<system>/ (with images/ and videos/ artwork beside the ROMs) and bios/.
# Credentials come from .env (gitignored; see .env.example), never from this file.
services:
  sovemu:
    environment:
      SOVEMU_ROMS_DIR: /nas/roms
      SOVEMU_SYSTEM_DIR: /nas/bios
      # direct: the NAS is on the same network; play from it as is (the usual case).
      # cache:  the NAS is remote (VPN, tunnel); keep played games and artwork on local disk,
      #         least recently used out past SOVEMU_CACHE_GB.
      # mirror: keep a full local copy in data/library (only SOVEMU_MIRROR_SYSTEMS, if set),
      #         synced in the background; play from it.
      SOVEMU_LIBRARY_MODE: ${SOVEMU_LIBRARY_MODE:-direct}
      SOVEMU_CACHE_GB: ${SOVEMU_CACHE_GB:-20}
      SOVEMU_MIRROR_SYSTEMS: ${SOVEMU_MIRROR_SYSTEMS:-}
    volumes:
      - nas:/nas:ro

volumes:
  nas:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SOVEMU_NAS_HOST:-nas.blh.casa}/${SOVEMU_NAS_PATH:-MEDIA/emulation}"
      o: "ro,username=${SOVEMU_NAS_USER:?set SOVEMU_NAS_USER in .env},password=${SOVEMU_NAS_PASSWORD:?set SOVEMU_NAS_PASSWORD in .env},uid=1000,gid=1000,vers=3.0"

# Run SovEmu locally: http://localhost:8080. Set SovEmu__Authentication__AdminUsername and SovEmu__Authentication__AdminPassword
# in .env to create the admin; without them the first visit asks for one.
#
#   scripts/fetch-free-roms.sh        # free homebrew into data/roms (or add your own ROMs there)
#   docker compose up --build
#
# ./data is mounted at /sov-data: the database, data/bios (BIOS files, any layout), data/saves and
# data/artwork (your own images, and downloaded game art). The library, data/roms (one folder per
# system: nes/, snes/, …), is mounted read-only at /sov-library: SovEmu never writes to it.
#
# Each game session streams WebRTC on its own UDP port (50000-50009). Browsers send media to
# SovEmu__Streaming__AdvertiseAddress, which a container cannot discover for itself: 127.0.0.1 works for a
# browser on this machine; use the host's LAN address for other devices.
services:
  sovemu:
    image: sovemu:dev
    # x86_64 only (the cores come from libretro's stable x86_64 release); an arm64 host runs it
    # under emulation.
    platform: linux/amd64
    build:
      context: .
      dockerfile: SovEmu.Backend/Dockerfile
      platforms: [linux/amd64]
    # Every SovEmu setting is an environment variable (see the README's table); put yours in
    # .env, which is loaded here as a whole, so no setting needs this file edited. Workers do
    # not inherit it: the server starts them with an empty environment.
    env_file:
      - path: .env
        required: false
    environment:
      SovEmu__Streaming__AdvertiseAddress: ${SovEmu__Streaming__AdvertiseAddress:-127.0.0.1}
      # Log lines in your own time (an IANA name, America/Chicago); UTC without one.
      TZ: ${TZ:-UTC}
    ports:
      - "8080:8080/tcp"
      - "50000-50009:50000-50009/udp"
      # The built-in relay, with SovEmu__Relay__Enabled=true (off by default, and the port may
      # be another TURN server's already):
      # - "3478:3478/udp"
      # - "3478:3478/tcp"
    volumes:
      - ./data:/sov-data
      - ./data/roms:/sov-library:ro
    # Dolphin (GameCube) maps its emulated memory from /dev/shm; Docker's default 64 MB makes
    # it die with a bus error.
    shm_size: 1gb
    restart: unless-stopped
    # Sessions write their saves on SIGTERM; give them SovEmu__Sessions__StopTimeoutSeconds and more.
    stop_grace_period: 30s
    # Whether the server answers /health. The slim image has no wget or curl, so bash makes the
    # request itself.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '^ok' <&3"
      interval: 30s
      timeout: 5s
      retries: 3

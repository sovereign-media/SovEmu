# Run SovEmu locally: http://localhost:8080 (the first visit creates the admin account).
#
#   scripts/fetch-free-roms.sh        # free homebrew into data/roms (or add your own ROMs there)
#   docker compose up --build
#
# ./data is mounted at /data: the database, data/roms (one folder per system: nes/, snes/, …),
# data/system (BIOS files) and data/saves.
#
# Each game session streams WebRTC on its own UDP port (50000-50009). Browsers send media to
# SOVEMU_ADVERTISE_IP, which a container cannot discover for itself: 127.0.0.1 works for a
# browser on this machine; use the host's LAN address for other devices.
services:
  sovemu:
    image: sovemu:dev
    build:
      context: .
      dockerfile: SovEmu.Backend/Dockerfile
    environment:
      SOVEMU_ADVERTISE_IP: ${SOVEMU_ADVERTISE_IP:-127.0.0.1}
    ports:
      - "8080:8080/tcp"
      - "50000-50009:50000-50009/udp"
    volumes:
      - ./data:/data
    restart: unless-stopped

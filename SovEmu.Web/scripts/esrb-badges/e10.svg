<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 60" role="img" aria-label="ESRB E10+: Ages 10+">
  <!-- SovEmu's own age-rating badge, after the proportions of the ESRB's: the rating's code
       filling a white panel in a dark frame, its ages along the foot. Not the ESRB's icon. -->
  <rect width="40" height="60" rx="3" fill="#111"/>
  <rect x="2.5" y="2.5" width="35" height="46" rx="1.5" fill="#fff"/>
  <text x="20" y="37.40" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#111" textLength="32" lengthAdjust="spacingAndGlyphs">E10<tspan font-size="21.1" dy="-10.2">+</tspan></text>
  <text x="20" y="56.6" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="6" font-weight="800" fill="#fff" textLength="28.4" lengthAdjust="spacingAndGlyphs">AGES 10+</text>
</svg>

image:
  tag: test
settings:
  LIBRARY_MODE: cache
  CACHE_GB: 50
  SCAN_INTERVAL_MINUTES: 30
  METADATA_AUTO: true
  SOVEMU_VIDEO_KBPS: 3000
  LOG_FORMAT: json
  TRUSTED_PROXIES: 10.42.0.0/16
  OTEL_ENDPOINT: http://otel-collector.monitoring:4318
secrets:
  SCREENSCRAPER_DEVPASSWORD: dev-password
existingSecret: sovemu-extra
admin:
  username: mum
  passwordSecret: {name: sovemu-admin, key: password}
users:
  - username: kid
    password: kid-password
  - username: dad
    passwordSecret: {name: sovemu-users, key: dad}
    admin: true
pruneUsers: true
systems:
  psx:
    core: pcsx_rearmed
    options:
      pcsx_rearmed_cd_readahead: 512
  gamegear:
    enabled: false
iceServers:
  - urls: turn:turn.example.com:3478
    username: sovemu
    credential: secret
library:
  type: nfs
  nfs: {server: nas.example.com, path: /emulation}
persistence:
  storageClass: fast
  size: 100Gi
media:
  ports: 4
  service:
    loadBalancerIP: 192.168.1.60
    annotations:
      metallb.universe.tf/allow-shared-ip: sovemu
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: games.example.com
      paths: [{path: /, pathType: Prefix}]
  tls:
    - secretName: sovemu-tls
      hosts: [games.example.com]
resources:
  requests: {cpu: "1", memory: 512Mi}
gpu:
  mode: /dev/dri/renderD128
  resources:
    amd.com/gpu: 1
annotations:
  keel.sh/policy: glob:bleeding-*
  keel.sh/trigger: poll

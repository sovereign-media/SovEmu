apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovemu.fullname" . }}
  labels:
    {{- include "sovemu.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sovemu.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- if not .Values.media.hostNetwork }}
---
# WebRTC media: one UDP port per concurrent game session, kept as they are so the ports the
# server advertises are the ports clients reach.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sovemu.fullname" . }}-media
  labels:
    {{- include "sovemu.labels" . | nindent 4 }}
  {{- with .Values.media.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.media.service.type }}
  {{- with .Values.media.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- if ne .Values.media.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ .Values.media.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "sovemu.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $i := until (int .Values.media.ports) }}
    {{- $port := add $.Values.media.firstPort $i }}
    - name: media-{{ $i }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
      {{- if eq $.Values.media.service.type "NodePort" }}
      nodePort: {{ $port }}
      {{- end }}
    {{- end }}
{{- end }}

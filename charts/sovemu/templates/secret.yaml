{{- $env := include "sovemu.secretEnv" . | fromYaml }}
{{- if $env }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sovemu.fullname" . }}
  labels:
    {{- include "sovemu.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

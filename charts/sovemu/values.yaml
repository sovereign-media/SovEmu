# SovEmu's Helm values. Every SovEmu setting is an environment variable (the README's
# configuration table lists them all); this chart only turns values into those variables, so a
# deployment is reproduced entirely from this file and its secrets. Nothing needs setting up in
# the UI afterwards.

image:
  # SovEmu.Backend/Dockerfile, built and pushed to your registry (no public image yet).
  repository: ghcr.io/sovereign-media/sovemu
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Settings as plain environment variables, without the SOVEMU_ prefix, e.g.
#   LIBRARY_MODE: cache
#   CACHE_GB: "50"
#   SCAN_INTERVAL_MINUTES: "30"
# They go into a ConfigMap. Values are strings: quote numbers and booleans.
settings: {}

# Secret settings, without the SOVEMU_ prefix (ADMIN_PASSWORD, METRICS_TOKEN,
# SCREENSCRAPER_DEVPASSWORD, SCREENSCRAPER_PASSWORD, THEGAMESDB_KEY, ...). They go into a Secret
# this chart creates. Prefer existingSecret for anything kept in Git.
secrets: {}

# A Secret you manage (sealed-secrets, external-secrets, ...) whose keys are full variable
# names (SOVEMU_ADMIN_PASSWORD, ...), loaded with envFrom.
existingSecret: ""

# The admin account, created at startup and kept in step with these values. With it set there
# is no first-run setup page.
admin:
  username: ""
  # Either a password (stored in the chart's Secret) or a key of an existing Secret.
  password: ""
  passwordSecret: {}
  #   name: sovemu-admin
  #   key: password

# Further accounts, created at startup and kept in step (SOVEMU_USERS__<n>__*). Each takes
# `password` or `passwordSecret: {name, key}`.
users: []
#  - username: kid
#    passwordSecret: {name: sovemu-users, key: kid}
#    admin: false

# Delete accounts that are not declared above at startup, so these values are the whole list.
pruneUsers: false

# Per-system overrides (SOVEMU_SYSTEMS__<id>__*): `core`, `enabled`, `options` (core options).
systems: {}
#  psx:
#    options:
#      pcsx_rearmed_cd_readahead: "512"
#  gamegear:
#    enabled: false

# Rendering for the 3D systems (N64, Dreamcast, GameCube, PS2). At startup the server tries
# every GPU the pod can see (drawing a frame on each) and uses the first that works, else Mesa's
# software renderer. Mesa (in the image) drives AMD and Intel GPUs; for NVIDIA's own driver,
# request `nvidia.com/gpu` and, where the cluster needs one, the NVIDIA runtime class.
gpu:
  # SOVEMU_GPU: auto | software | off | a render node such as /dev/dri/renderD128.
  mode: auto
  # Device-plugin resources that put a GPU in the pod (the usual way), e.g.
  #   gpu.intel.com/i915: 1     (Intel GPU device plugin)
  #   amd.com/gpu: 1            (AMD GPU device plugin)
  #   nvidia.com/gpu: 1         (NVIDIA device plugin / GPU operator)
  resources: {}
  # The runtime class that injects NVIDIA's driver into the pod (`nvidia` with the NVIDIA GPU
  # operator or container toolkit), where the cluster does not make it the default.
  runtimeClassName: ""
  # Without a device plugin: mount the node's /dev/dri. Needs the render group's GID (on the
  # node: stat -c %g /dev/dri/renderD128), and a runtime that allows the device; some only do
  # for privileged pods.
  hostDevice:
    enabled: false
    path: /dev/dri
    renderGroup: null

# STUN/TURN servers for browsers that cannot reach the media ports directly (RTCIceServer
# objects), as SOVEMU_ICE_SERVERS.
iceServers: []
#  - urls: turn:turn.example.com:3478
#    username: sovemu
#    credential: secret

# The library (Batocera layout: roms/<system>/, bios/). Mounted read-only at /library;
# SovEmu never writes to it.
library:
  # none | existingClaim | nfs | hostPath
  type: none
  existingClaim: ""
  nfs:
    server: ""
    path: ""
  hostPath: ""
  # Paths inside the library.
  romsPath: roms
  biosPath: bios

# The database, saves, states, caches and (in mirror mode) the mirror, at /data.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 20Gi

# WebRTC media: every game session streams on its own UDP port, from firstPort, one port per
# concurrent session. Browsers must reach advertiseIP on those ports.
media:
  firstPort: 50000
  ports: 10
  # The address clients send media to: the LoadBalancer's IP, or the node's with hostNetwork.
  # Required unless hostNetwork is on and the node's own address is the right one.
  advertiseIP: ""
  # Put the pod on the node's network: no Service needed for media, ports open on the node.
  hostNetwork: false
  service:
    # LoadBalancer (MetalLB, a cloud LB) keeps the ports as they are. NodePort cannot: the
    # ports would have to fall inside the cluster's NodePort range.
    type: LoadBalancer
    loadBalancerIP: ""
    annotations: {}
    externalTrafficPolicy: Local

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sovemu.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: sovemu-tls
  #    hosts: [sovemu.example.com]

resources: {}
#  requests: {cpu: "1", memory: 512Mi}
#  limits: {memory: 2Gi}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# /dev/shm for the game workers: Dolphin (GameCube) maps its emulated memory there.
shmSize: 1Gi

podAnnotations: {}
podLabels: {}
# The image is x86_64 only (its cores come from libretro's stable x86_64 release), so pods stay
# off arm64 nodes. Add to this rather than replacing it.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}

# Extra environment variables (full EnvVar objects), for anything the values above miss.
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
